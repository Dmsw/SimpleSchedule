<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 序</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1d2939;font:16px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{background:white;border:1px solid #e5e9ef;border-radius:16px;padding:32px;width:min(100%,380px)}h1{margin:0 0 8px;font-size:26px}p{color:#687587;font-size:14px}label{display:block;margin-top:20px}input,button{width:100%;font:inherit;padding:11px;border:1px solid #d6dce4;border-radius:8px}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #286c59;outline-offset:3px}button{background:#286c59;color:white;cursor:pointer;margin-top:24px}button:disabled{opacity:.6;cursor:wait}a{color:#286c59}#status{min-height:24px;color:#b33d40;overflow-wrap:anywhere}</style></head>
<body><main><h1>登录 · 序</h1><p>登录后，在你的设备之间同步日程。</p><form id="loginForm"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><button id="submit" type="submit">登录</button></form><p id="status" role="status" aria-live="polite"></p><p>仅限已有账号，不开放注册。</p><a href="./">返回本地日程</a></main>
<script src="assets/sync.js"></script><script src="assets/login.js"></script></body></html>
